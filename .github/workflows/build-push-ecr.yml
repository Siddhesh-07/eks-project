name: Build and Push Images to ECR

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build-push-ecr.yml'

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1

jobs:
  # =====================================================
  # JOB 1: BUILD AND PUSH IMAGES
  # =====================================================
  build-and-push:
    name: Build and Push Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push all services
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          services=(
            "adservice:./src/adservice"
            "cartservice:./src/cartservice/src"
            "checkoutservice:./src/checkoutservice"
            "currencyservice:./src/currencyservice"
            "emailservice:./src/emailservice"
            "frontend:./src/frontend"
            "paymentservice:./src/paymentservice"
            "productcatalogservice:./src/productcatalogservice"
            "recommendationservice:./src/recommendationservice"
            "shippingservice:./src/shippingservice"
          )

          for service in "${services[@]}"; do
            NAME="${service%%:*}"
            PATH_DIR="${service#*:}"

            echo "=== Building and Pushing $NAME from $PATH_DIR ==="

            docker build \
              -t "$ECR_REGISTRY/online-boutique/$NAME:$IMAGE_TAG" \
              "$PATH_DIR"

            docker push \
              "$ECR_REGISTRY/online-boutique/$NAME:$IMAGE_TAG"
          done

      - name: Display image tag
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "Images successfully pushed with tag: $IMAGE_TAG"
          echo "ECR Registry used: $ECR_REGISTRY"

  # =====================================================
  # JOB 2: UPDATE KUSTOMIZE
  # =====================================================
  update-manifests:
    name: Update Kubernetes Image Tags
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Update Kustomize image tags
        run: |
          KUSTOMIZATION_FILE="kubernetes-manifests/kustomization.yaml"

          sed -i "s/newTag: .*/newTag: $IMAGE_TAG/g" "$KUSTOMIZATION_FILE"

          echo "Updated image tags to:"
          grep "newTag:" "$KUSTOMIZATION_FILE"

      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes-manifests/kustomization.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes detected."
            exit 0
          fi

          git commit -m "chore(gitops): update image tags to $IMAGE_TAG"

          git pull --rebase origin main
          git push